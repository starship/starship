"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](shade1)\
$os\
$username\
[](bg:shade1 fg:text1)\
$hostname\
[](bg:shade2 fg:shade1)\
$directory\
[](bg:shade3 fg:shade2)\
$git_branch\
$git_status\
[](fg:shade3 bg:shade4)\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:shade4 bg:shade5)\
$conda\
[](fg:shade5 bg:shade6)\
$time\
[ ](fg:shade6)\
$cmd_duration\
$line_break\
$character"""

palette = 'gray'

[os]
disabled = false
style = "bg:shade1 fg:text1"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[hostname]
ssh_only = false
style = "bg:shade1 fg:text1"
format = '[$hostname]($style)'
trim_at = '.'
disabled = false

[username]
show_always = true
style_user = "bg:shade1 fg:text1"
style_root = "bg:shade1 fg:text1"
format = '[ $user]($style)'

[directory]
style = "bg:shade2 fg:text2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:shade3"
format = '[[ $symbol $branch ](fg:text3 bg:shade3)]($style)'

[git_status]
style = "bg:shade3"
format = '[[($all_status$ahead_behind )](fg:text3 bg:shade3)]($style)'

[nodejs]
symbol = ""
style = "bg:shade4"
format = '[[ $symbol( $version) ](fg:text4 bg:shade4)]($style)'

[bun]
symbol = ""
style = "bg:shade4"
format = '[[ $symbol( $version) ](fg:text4 bg:shade4)]($style)'

[c]
symbol = " "
style = "bg:shade4"
format = '[[ $symbol( $version) ](fg:text4 bg:shade4)]($style)'

[rust]
symbol = ""
style = "bg:shade4"
format = '[[ $symbol( $version) ](fg:text4 bg:shade4)]($style)'

[golang]
symbol = ""
style = "bg:shade4"
format = '[[ $symbol( $version) ](fg:text4 bg:shade4)]($style)'

[php]
symbol = ""
style = "bg:shade4"
format = '[[ $symbol( $version) ](fg:text4 bg:shade4)]($style)'

[java]
symbol = " "
style = "bg:shade4"
format = '[[ $symbol( $version) ](fg:text4 bg:shade4)]($style)'

[jj_bookmark]
symbol = ""
style = "bg:shade3"
format = '[[ $symbol $bookmark(@$remote)$diverged( \\(+$overflow_count others\\)) ](fg:text3 bg:shade3)]($style)'

[jj_status]
style = "bg:shade3"
format = '[[($all )](fg:text3 bg:shade3)]($style)'

[kotlin]
symbol = ""
style = "bg:shade4"
format = '[[ $symbol( $version) ](fg:text4 bg:shade4)]($style)'

[haskell]
symbol = ""
style = "bg:shade4"
format = '[[ $symbol( $version) ](fg:text4 bg:shade4)]($style)'

[python]
symbol = ""
style = "bg:shade4"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:text4 bg:shade4)]($style)'

[docker_context]
symbol = ""
style = "bg:shade5"
format = '[[ $symbol( $context) ](fg:text5 bg:shade5)]($style)'

[conda]
symbol = "  "
style = "fg:text5 bg:shade5"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:shade6"
format = '[[  $time ](fg:text6 bg:shade6)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:shade4)'
error_symbol = '[❯](bold fg:shade1)'
vimcmd_symbol = '[❮](bold fg:shade4)'
vimcmd_replace_one_symbol = '[❮](bold fg:shade6)'
vimcmd_replace_symbol = '[❮](bold fg:shade6)'
vimcmd_visual_symbol = '[❮](bold fg:shade3)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:shade6"
disabled = false
show_notifications = true
min_time_to_notify = 45000

