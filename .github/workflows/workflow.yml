name: Main workflow
on:
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  # The source repository distinguishes identically named branches in forks;
  # the branch name lets a newer push cancel its superseded workflow run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  CARGO_BUILD_WARNINGS: deny
  RUSTUP_MAX_RETRIES: 10
  MACOSX_DEPLOYMENT_TARGET: 10.7

jobs:
  # Run the `rustfmt` code formatter
  rustfmt:
    name: Rustfmt [Formatter]
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup | Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update

      - name: Build | Format
        run: cargo fmt --all -- --check

  # Run the `clippy` linting tool
  clippy:
    name: Clippy [Linter]
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup | Rust
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update

      - name: Setup | Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build | Lint
        run: cargo clippy --workspace --locked -- -D warnings

  # Ensure that the project could be successfully compiled
  cargo_check:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup | Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Setup | Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build | Check
        run: cargo check --workspace --locked

  # Ensure that the project could be successfully compiled with no features enabled
  cargo_check_no_features:
    name: Compile with no features enabled
    needs: cargo_check
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup | Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Setup | Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build | Check
        run: cargo check --workspace --locked --no-default-features

  # Ensure that the project could be successfully compiled with all features enabled
  cargo_check_all_features:
    name: Compile with all features enabled
    needs: cargo_check
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup | Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Setup | Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build | Check
        run: cargo check --workspace --locked --all-features

  # Check if config schema needs to be updated to reflect updated configuration options
  check_if_config_schema_up_to_date:
    name: Check if config schema is up to date
    needs: cargo_check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup | Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Setup | Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run | Generate Schema
        run: cargo run --locked --features config-schema -- config-schema > .github/config-schema.json

      - name: Check | Detect Changes
        run: |
          if ! git diff --exit-code .github/config-schema.json; then
            echo "::error file=.github/config-schema.json::config-schema.json is out of date. Run 'cargo run --features config-schema -- config-schema > .github/config-schema.json' and commit the result."
            exit 1
          fi

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    needs: cargo_check # First check then run expansive tests
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
        rust: [stable, nightly]
        include:
          - os: windows-latest
            rustflags: -C target-feature=+crt-static
    env:
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install all the required dependencies for testing
      - name: Setup | Rust
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component llvm-tools-preview --no-self-update
          rustup default ${{ matrix.rust }}

      - name: Setup | Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: cargo-llvm-cov,cargo-nextest@0.9.140

      # For windows installer test
      # On stable rust & main repo pushes only
      - name: Install cargo-wix [Windows]
        continue-on-error: true
        if: matrix.os == 'windows-latest' && matrix.rust == 'stable'
        run: cargo install --version 0.3.9 cargo-wix
        env:
          # cargo-wix does not require static crt
          RUSTFLAGS: ""

      # Install Mercurial (pre-installed on Linux)
      - name: Setup | Mercurial (macos)
        if: matrix.os == 'macOS-latest'
        run: brew install mercurial

      - name: Setup | Mercurial (windows)
        if: matrix.os == 'windows-latest'
        run: |
          winget install --id Mercurial.Mercurial --silent --exact --disable-interactivity --accept-source-agreements
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Mercurial" -Encoding utf8

      # The pseudo-terminal shell tests (tests/init_async.rs) need real shell
      # binaries and drive them from an actual terminal, so they only run on
      # one matrix leg — running them across every OS x Rust channel would be
      # both wasteful and, on Windows/macOS runners, impossible regardless.
      - name: Setup | Streaming shells
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: sudo apt-get update && sudo apt-get install --yes bash fish gawk make xonsh zsh

      - name: Setup | ble.sh
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: |
          git clone --depth 1 --branch v0.4.0-devel3 https://github.com/akinomyoga/ble.sh.git "$RUNNER_TEMP/ble.sh"
          make -C "$RUNNER_TEMP/ble.sh"

      # ble.sh builds its terminfo/keymap cache into a directory shared by
      # every invocation of this checkout (it falls back to a path under its
      # own install dir whenever $HOME has no pre-existing ~/.cache) and does
      # so with no locking of its own. Left cold, two of the pty tests below
      # can both attach for the first time at once and race to write it,
      # corrupting each other's temp files. Building the cache once here,
      # serially, in a HOME that hits that same fallback path, means every
      # test that attaches afterwards finds it already warm.
      - name: Setup | Warm ble.sh's cache
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: |
          python3 - <<'EOF'
          import os
          import pty
          import select
          import subprocess
          import time

          home = os.path.join(os.environ["RUNNER_TEMP"], "ble-warmup-home")
          os.makedirs(home, exist_ok=True)
          env = dict(os.environ)
          env["HOME"] = home
          env["TERM"] = "xterm-256color"

          master, slave = pty.openpty()
          proc = subprocess.Popen(
              ["bash", "--noprofile", "--norc", "-i"],
              stdin=slave,
              stdout=slave,
              stderr=slave,
              env=env,
              preexec_fn=os.setsid,
          )
          os.close(slave)
          os.write(master, b'source "$BLE_SH"\n')

          # Cache-building issues terminal queries nothing here answers, so it
          # falls back to its own internal timeouts rather than a fixed pace.
          # Wait for output to actually go quiet — cache-building finished, or
          # bash is stuck waiting on a query response — rather than guessing
          # how long that takes.
          deadline = time.time() + 60
          quiet_since = time.time()
          while time.time() < deadline:
              ready, _, _ = select.select([master], [], [], 1)
              if ready:
                  try:
                      if not os.read(master, 65536):
                          break
                  except OSError:
                      break
                  quiet_since = time.time()
              elif time.time() - quiet_since > 5:
                  break

          os.write(master, b"exit\n")
          deadline = time.time() + 10
          while time.time() < deadline:
              try:
                  if not os.read(master, 65536):
                      break
              except OSError:
                  break
          proc.wait(timeout=5)
          EOF
        env:
          BLE_SH: ${{ format('{0}/ble.sh/out/ble.sh', runner.temp) }}

      - name: Build | Nushell main
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: |
          git init "$RUNNER_TEMP/nushell"
          git -C "$RUNNER_TEMP/nushell" remote add origin https://github.com/nushell/nushell.git
          git -C "$RUNNER_TEMP/nushell" fetch --depth 1 origin 5d80505557115920993296600f57233c30a4248b
          git -C "$RUNNER_TEMP/nushell" checkout --detach FETCH_HEAD
          cargo build --locked --manifest-path "$RUNNER_TEMP/nushell/Cargo.toml" --bin nu
        env:
          RUSTFLAGS: ""

      # Run the ignored tests that expect the above setup.
      # `--run-ignored all` is nextest's spelling of `--include-ignored`.
      #
      # Coverage instrumentation is stable-only: cargo-llvm-cov's pinned
      # release periodically falls out of sync with nightly rust's own
      # ABI/codegen churn, which surfaces as every test passing and then
      # object-file collection failing outright — a tool-compatibility
      # failure, not a real test one. Nightly's purpose in this matrix is
      # to catch compiler regressions in pass/fail, not to contribute a
      # coverage number.
      - name: Build | Test
        if: matrix.rust == 'stable'
        run: "cargo llvm-cov nextest
          --all-features
          --locked
          --workspace
          -E '${{ (matrix.os == 'ubuntu-latest' && matrix.rust == 'stable') && 'all()' || 'not binary(init_async)' }}'
          --lcov --output-path lcov.info
          --run-ignored all"
        env:
          CARGO_BUILD_WARNINGS: deny
          # Snapshot mismatches must fail the run rather than writing
          # `.snap.new` files nobody will look at on a CI runner.
          INSTA_UPDATE: "no"
          BASH: ${{ (matrix.os == 'ubuntu-latest' && matrix.rust == 'stable') && '/usr/bin/bash' || '' }}
          BLE_SH: ${{ (matrix.os == 'ubuntu-latest' && matrix.rust == 'stable') && format('{0}/ble.sh/out/ble.sh', runner.temp) || '' }}
          NUSHELL_MAIN: ${{ (matrix.os == 'ubuntu-latest' && matrix.rust == 'stable') && format('{0}/nushell/target/debug/nu', runner.temp) || '' }}
          POWERSHELL_MAIN: ${{ (matrix.os == 'ubuntu-latest' && matrix.rust == 'stable') && '/usr/bin/pwsh' || '' }}
          XONSH_MAIN: ${{ (matrix.os == 'ubuntu-latest' && matrix.rust == 'stable') && '/usr/bin/xonsh' || '' }}

      # Nightly has no shell-streaming setup (see the comment on the stable
      # `Build | Test` step above), so it only needs the non-init_async slice.
      - name: Build | Test [Nightly]
        if: matrix.rust == 'nightly'
        run: "cargo nextest run
          --all-features
          --locked
          --workspace
          -E 'not binary(init_async)'"
        env:
          # Nightly's own warnings are not this project's to fix.
          CARGO_BUILD_WARNINGS: allow
          INSTA_UPDATE: "no"

      - name: Build | Installer [Windows]
        continue-on-error: true
        if: matrix.os == 'windows-latest' && matrix.rust == 'stable'
        run: >
          cargo wix --dbg-build -v --nocapture -I install/windows/main.wxs
          --output target/debug/starship-x86_64-pc-windows-msvc.msi

      - name: Build | Chocolatey Package [Windows]
        continue-on-error: true
        if: matrix.os == 'windows-latest' && matrix.rust == 'stable'
        run: |
          # Setup dummy release artifacts
          foreach ($arch in @("aarch64", "i686", "x86_64")) {
            foreach ($ext in @("zip", "msi")) {
              New-Item -ItemType Directory -Path ./starship-$arch-pc-windows-msvc.$ext
              New-Item -ItemType File -Path ./starship-$arch-pc-windows-msvc.$ext/starship-$arch-pc-windows-msvc.$ext
            }
          }
          # Build package
          pwsh ./install/windows/choco/update.ps1
        env:
          STARSHIP_VERSION: v1.2.3

      - name: Sign | Upload Executable [Windows]
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        id: unsigned-artifacts
        if: matrix.os == 'windows-latest' && matrix.rust == 'stable' && github.event_name == 'push' && github.repository == 'starship/starship'
        with:
          name: unsigned-artifacts-dbg
          path: |
            target/debug/starship.exe
            target/debug/starship-x86_64-pc-windows-msvc.msi

      - name: Sign | Sign [Windows]
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        continue-on-error: true
        if: matrix.os == 'windows-latest' && matrix.rust == 'stable' && github.event_name == 'push' && github.repository == 'starship/starship'
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'starship'
          github-artifact-id: '${{ steps.unsigned-artifacts.outputs.artifact-id }}'
          signing-policy-slug: 'test-signing'
          wait-for-completion: true
          output-artifact-directory: target/debug

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: github.repository == 'starship/starship' && matrix.rust == 'stable'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
