[package]
name = "starship"
version = "1.26.0"
authors = ["Starship Contributors"]
build = "build.rs"
categories = ["command-line-utilities"]
documentation = "https://starship.rs/guide/"
edition = "2024"
homepage = "https://starship.rs"
# Keep `/` in front of `README.md` to exclude localized readmes
include = [
  "src/**/*",
  "/starship.exe.manifest",
  "media/icon.ico",
  "build.rs",
  "LICENSE",
  "/README.md",
  "docs/public/presets/toml/",
  ".github/config-schema.json",
]
keywords = ["prompt", "shell", "bash", "fish", "zsh"]
license = "ISC"
readme = "README.md"
repository = "https://github.com/starship/starship"
# Note: MSRV is only intended as a hint, and only the latest version is officially supported in starship.
rust-version = "1.95"
description = """
The minimal, blazing-fast, and infinitely customizable prompt for any shell! ☄🌌️
"""

[features]
default = ["battery", "notify"]
battery = ["starship-battery"]
config-schema = ["schemars"]
notify = ["notify-rust"]

[dependencies]
clap = { version = "4.6.6", features = ["derive", "cargo", "unicode"] }
clap_complete = "4.6.9"
clap_complete_nushell = "4.6.2"
dirs = "6.0.0"
dunce = "1.0.5"
# default feature restriction addresses https://github.com/starship/starship/issues/4251
gix = { version = "0.87.1", default-features = false, features = [
  "max-performance-safe",
  "revision",
  "status",
  "sha1",
  "sha256",
] }
guess_host_triple = "0.1.5"
home = "0.5.12"
indexmap = { version = "2.14.0", features = ["serde"] }
jiff = { version = "0.2.35", features = ["serde"] }
jsonc-parser = { version = "0.33.1", features = ["serde"] }
log = { version = "0.4.34", features = ["std"] }
# notify-rust is optional (on by default) because the crate doesn't currently build for darwin with nix
# see: https://github.com/NixOS/nixpkgs/issues/160876
notify-rust = { version = "4.18.0", optional = true }
nu-ansi-term = "0.50.3"
open = "5.4.2"
# update os module config and tests when upgrading os_info
os_info = { version = "3.15.0", features = ["schemars"] }
# for efficient shared state between `git_status` and `git_metrics`, allowing parallel printing. This is for poison-free locks.
parking_lot = "0.12.5"
path-slash = "0.2.1"
pest = "2.9.0"
pest_derive = "2.9.0"
process_control = "5.2.0"
quick-xml = "0.42.0"
rand = "0.10.2"
rayon = "1.12.0"
regex = { version = "1.13.1", default-features = false, features = ["perf", "std", "unicode-perl"] }
rust-ini = "0.21.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
shadow-rs = { version = "2.0.0", default-features = false, features = ["build"] }
shell-words = "1.1.1"
# battery is optional (on by default) because the crate doesn't currently build for Termux
# see: https://github.com/svartalf/rust-battery/issues/33
starship-battery = { version = "0.11.1", optional = true }
strsim = "0.11.1"
systemstat = "=0.2.7"
tempfile = "3.27.0"
terminal_size = "0.4.4"
toml = { version = "1.1.4", features = ["preserve_order"] }
toml_edit = "0.25.13"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
urlencoding = "2.1.3"
versions = "7.0.0"
which = "8.0.6"
whoami = { version = "2.1.3", default-features = false, features = ["std", "wasi-wasite"] }
yaml-rust2 = "0.12.0"

[dependencies.schemars]
version = "1.2.2"
optional = true
features = ["preserve_order", "indexmap2"]

[target.'cfg(windows)'.dependencies]
deelevate = "0.2.0"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
]

[target.'cfg(not(windows))'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["feature", "fs", "user", "signal"] }

[build-dependencies]
shadow-rs = { version = "2.0.0", default-features = false, features = ["build"] }
dunce = "1.0.5"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
# Pinned: the pty-backed shell integration tests under `src/test/init_async/`
# depend on this crate answering cursor-position-report queries (`ESC[6n`)
# natively via `Term::device_status`, which real line editors require in order
# not to stall. Do not swap this for another pseudo-terminal crate.
alacritty_terminal = "0.26.0"
# Snapshot assertions for rendered module output. The `filters` feature lets a
# snapshot redact the randomly named temporary directories that some module
# tests necessarily render. Note that insta's ANSI-escape-stripping support is
# deliberately NOT enabled: the ANSI styling is part of the contract under test.
insta = { version = "1.48.0", features = ["filters"] }
mockall = "=0.15.0"
# Property-based testing for the incremental repaint algorithm in
# `src/damage/`. Its central invariant -- that replaying the emitted damage
# yields the same terminal grid as a full render -- is universally quantified
# over prompts, so it is stated as a property rather than as examples.
proptest = "1.11.0"
# Drives that invariant over *sequences* of prompt updates rather than single
# pairs, because incremental repaint is stateful: a wrong repaint only shows up
# once a later update stops on top of the residue the earlier one left behind.
# Shrinking a failing sequence down to a minimal reproduction is the reason for
# the state-machine layer specifically.
proptest-state-machine = "0.8.0"
# Parameterized tests and fixtures, replacing hand-rolled `for` loops over
# cases: every case becomes its own named test, so one failing case neither
# hides the others nor loses the identity of the case that broke.
rstest = "0.26.1"

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.bench]
codegen-units = 16
lto = "thin"
strip = false

[lints.clippy]
use_self = "warn"
